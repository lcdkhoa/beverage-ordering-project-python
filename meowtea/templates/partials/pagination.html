{% if total_pages and total_pages > 1 %}
  <nav class="pagination" aria-label="Pagination">
    {% set prev_page = page - 1 %}
    {% set next_page = page + 1 %}
    <a href="?page={{ prev_page }}" class="pagination-btn {% if page <= 1 %}disabled{% endif %}" data-page="{{ prev_page }}">Trước</a>
    {% for p in range(1, total_pages + 1) %}
      {% if p == page %}
        <span class="pagination-number active" data-page="{{ p }}">{{ p }}</span>
      {% else %}
        <a href="?page={{ p }}" class="pagination-number" data-page="{{ p }}">{{ p }}</a>
      {% endif %}
    {% endfor %}
    <a href="?page={{ next_page }}" class="pagination-btn {% if page >= total_pages %}disabled{% endif %}" data-page="{{ next_page }}">Sau</a>
  </nav>
{% endif %}
